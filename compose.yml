services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: answerloop
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: answerloop_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answerloop -d answerloop_development"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://answerloop:local_dev_password@db:5432/answerloop_development
      MAIL_FROM: no-reply@answerloop.local
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - app_storage:/app/storage
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  app_storage:
